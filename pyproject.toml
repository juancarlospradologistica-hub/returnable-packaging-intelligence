[project]
name = "rpi"
version = "0.1.0"
description = "Analisis de rotacion y perdidas de contenedores retornables en flota multi-planta con datos MB51 sinteticos."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Juan Carlos Prado Arias" }
]

dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "faker>=30.0",
    "pandera>=0.20",
    "pydantic>=2.0",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "dbt-duckdb>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rpi"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
