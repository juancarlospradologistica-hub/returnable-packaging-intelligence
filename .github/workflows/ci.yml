name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.15"

      - name: instalar dependencias
        run: uv sync --frozen

      - name: lint
        run: uv run ruff check src/ tests/ notebooks/

      # 12 meses: con menos no hay salidas de 120 días antes de una
      # conciliación y los tests de merma no tienen qué medir.
      - name: generar dataset CI
        run: uv run python -m rpi --months 12 --plants 2 --country MX

      - name: ingestar a DuckDB
        run: uv run python -c "from rpi.db import ingest; ingest()"

      # build = run + test en orden del DAG; un test que falla detiene lo que depende de él.
      - name: dbt build
        run: uv run dbt build --profiles-dir .

      - name: tests con cobertura
        run: |
          uv run pytest tests/ \
            --cov=src/rpi \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: subir reporte de cobertura
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
