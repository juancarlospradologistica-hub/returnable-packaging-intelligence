name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Runner y actions fijos (ADR-024): el dataset tiene que salir igual en cada
    # corrida, y un cambio de imagen o de action se decide con CI de prueba,
    # no cuando GitHub mueve una etiqueta.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: instalar uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.15"

      - name: instalar dependencias
        run: uv sync --frozen

      - name: lint
        run: uv run ruff check src/ tests/ notebooks/

      - name: formato
        run: uv run ruff format --check src/ tests/ notebooks/

      # 18 meses, igual que el completo: mismas ventanas de necesidad,
      # backtest y calibración de z (ADR-025). Con 12 la calibración se queda
      # con 12 semanas de historia y la σ sale corta.
      - name: generar dataset CI
        run: uv run python -m rpi --months 18 --plants 2 --country MX

      - name: ingestar a DuckDB
        run: uv run python -c "from rpi.db import ingest; ingest()"

      # build = run + test en orden del DAG; un test que falla detiene lo que depende de él.
      - name: dbt build
        run: uv run dbt build --profiles-dir .

      - name: tests con cobertura
        run: |
          uv run pytest tests/ \
            --cov=src/rpi \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      # Paso sucio (ADR-028, punto 12): mismo reducido con los 18 defectos.
      # dbt run no puede tronar; las reglas corren como warn y pytest exige que
      # cada registro de la bitácora lo reporte la regla de su defecto.
      - name: generar dataset CI con defectos
        run: uv run python -m rpi --months 18 --plants 2 --country MX --defectos todos --output data/sucio

      - name: ingestar dataset con defectos
        run: uv run python -c "from rpi.db import ingest; ingest(raw_dir='data/sucio')"
        env:
          RPI_DB: data/sucio.duckdb

      - name: dbt con defectos
        run: |
          uv run dbt seed --profiles-dir .
          uv run dbt run --profiles-dir .
          uv run dbt test --profiles-dir . --select tag:calidad --vars '{calidad_reporte: true}'
        env:
          RPI_DB: data/sucio.duckdb

      - name: reglas contra la bitácora
        run: uv run pytest tests/test_calidad.py -v -s
        env:
          RPI_DB: data/sucio.duckdb

      - name: subir reporte de cobertura
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
