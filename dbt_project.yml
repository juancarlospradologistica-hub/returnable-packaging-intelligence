name: rpi
version: "1.0.0"
profile: rpi

model-paths: ["models"]
test-paths: ["tests_dbt"]
seed-paths: ["seeds"]

models:
  rpi:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

vars:
  # Antigüedad que necesita una salida para pasar por una conciliación (ADR-012).
  # La usan la tasa de merma, las rutas y la merma pendiente de la flota.
  antiguedad_conciliacion_dias: 120
  # Semanas completas antes del plan que cuentan como base de embarques.
  # Igual que PlanConfig.base_weeks del generador (ADR-017, supuestos).
  ventana_base_semanas: 13
  # Necesidad de flota (ADR-021, ADR-023). Ventana de la variabilidad del stock
  # en uso, semanas que se descartan cuando la foto inicial no trae stock en
  # cliente (el saldo V tarda en llenarse) y backtest de la fórmula.
  ventana_sigma_semanas: 52
  semanas_arranque: 13
  backtest_semanas: 13
  semanas_minimas_estimacion: 26
  # Fuera de muestra, la z económica puede fallar su objetivo de días con
  # quiebre por a lo más estos puntos porcentuales (ADR-025).
  backtest_tolerancia_pp: 1.0
  # Reglas de calidad (ADR-028, ADR-030). Días naturales después del fin de
  # mes en que se cierra el periodo; banda de precio contra la mediana del
  # grupo; tolerancia entre precio del documento y del maestro. Con
  # calidad_reporte en true las reglas que bloquean corren como warn.
  calidad_dias_cierre: 10
  calidad_banda_precio: 3
  calidad_tolerancia_precio_pct: 5
  calidad_reporte: false
  # Materialidad (ADR-028, ADR-031): un defecto bloquea si en algún nivel del
  # arnés mueve una cifra publicada más que este porcentaje.
  calidad_materialidad_pct: 1
