version: 2

seeds:
  - name: almacenes
    description: Lgort → estado del ciclo del empaque (ADR-017). Un MB51 real se mapea aquí.
    config:
      column_types:
        lgort: varchar
    columns:
      - name: lgort
        tests:
          - not_null
          - unique
      - name: estado
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['recepcion', 'vacios', 'linea', 'llenos', 'sucios', 'reparacion', 'scrap', 'fuera_ciclo']

  - name: clases_movimiento
    description: Bwart → evento del ciclo (ADR-017). Un MB51 real se mapea aquí.
    config:
      column_types:
        bwart: varchar
    columns:
      - name: bwart
        tests:
          - not_null
          - unique
      - name: evento
        tests:
          - not_null
          - unique

  - name: parametros_flota
    description: >
      Parámetros de política por tipo de empaque (ADR-017, punto 11; ADR-021).
      Los decide la planta, no el dato: días de cobertura como piso del stock de
      seguridad, z sobre la variabilidad del stock en uso y lead time de compra.
    config:
      column_types:
        tipo_material: varchar
        dias_cobertura: integer
        z_servicio: double
        lead_time_semanas: integer
    columns:
      - name: tipo_material
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['KLT', 'RACK']
      - name: dias_cobertura
        tests: [not_null]
      - name: z_servicio
        tests: [not_null]
      - name: lead_time_semanas
        tests: [not_null]
