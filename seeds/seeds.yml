version: 2

seeds:
  - name: almacenes
    description: Lgort → estado del ciclo del empaque (ADR-017). Un MB51 real se mapea aquí.
    config:
      column_types:
        lgort: varchar
    columns:
      - name: lgort
        tests:
          - not_null
          - unique
      - name: estado
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['recepcion', 'vacios', 'linea', 'llenos', 'sucios', 'reparacion', 'scrap', 'fuera_ciclo']

  - name: unidades_extracto
    description: >
      Unidad de medida de un extracto real → Meins del contrato (ADR-035). ST es
      la clave interna de pieza en SAP y PC su formato externo en inglés. Cada
      empresa agrega aquí sus unidades; una que falte llega tal cual y la marca
      el schema en la ingesta.
    config:
      column_types:
        unidad: varchar
        meins: varchar
    columns:
      - name: unidad
        tests:
          - not_null
          - unique
      - name: meins
        tests: [not_null]

  - name: clases_movimiento
    description: Bwart → evento del ciclo (ADR-017). Un MB51 real se mapea aquí.
    config:
      column_types:
        bwart: varchar
    columns:
      - name: bwart
        tests:
          - not_null
          - unique
      - name: evento
        tests:
          - not_null
          - unique

  - name: grupos_material
    description: >
      Grupo de artículos (MARA-MATKL) → tipo de empaque (ADR-028). El tipo sale
      del maestro y no del código de material: un extracto real con Matnr
      numérico se mapea aquí. mtart es el tipo de material SAP que se espera
      para el grupo.
    config:
      column_types:
        matkl: varchar
        tipo_material: varchar
        mtart: varchar
    columns:
      - name: matkl
        tests: [not_null, unique]
      - name: tipo_material
        description: Un extracto real puede tener varios grupos por tipo (KLT chico, KLT grande).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['KLT', 'RACK', 'CARTON']
      - name: mtart
        tests: [not_null]

  - name: parametros_flota
    description: >
      Parámetros de política por tipo de empaque (ADR-017, punto 11; ADR-021;
      ADR-025). Los decide la planta, no el dato: días de cobertura como piso del
      stock de seguridad, lead time de compra y los dos costos que fijan la z
      económica. El costo de quedarse corto es el desechable equivalente por el
      factor de quiebre (manejo, urgencia, aprobación del cliente); el de pasarse,
      el costo de capital sobre el costo unitario. El flete de un préstamo entre
      plantas es un porcentaje del costo unitario, más caro entre países por
      aduana e importación temporal. Vida útil, mantenimiento por ciclo y
      desechable equivalente son los supuestos del TCO (ADR-010, ADR-028); el
      costo unitario no vive aquí, sale del maestro de materiales.
    config:
      column_types:
        tipo_material: varchar
        dias_cobertura: integer
        lead_time_semanas: integer
        factor_costo_quiebre: double
        costo_capital_anual_pct: double
        flete_mismo_pais_pct: double
        flete_otro_pais_pct: double
        vida_util_ciclos: integer
        mant_por_ciclo_usd: double
        desechable_equiv_usd: double
    columns:
      - name: tipo_material
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['KLT', 'RACK']
      - name: dias_cobertura
        tests: [not_null]
      - name: lead_time_semanas
        tests: [not_null]
      - name: factor_costo_quiebre
        tests: [not_null]
      - name: costo_capital_anual_pct
        tests: [not_null]
      - name: flete_mismo_pais_pct
        tests: [not_null]
      - name: flete_otro_pais_pct
        tests: [not_null]
      - name: vida_util_ciclos
        tests: [not_null]
      - name: mant_por_ciclo_usd
        tests: [not_null]
      - name: desechable_equiv_usd
        tests: [not_null]

  - name: plantas
    description: >
      País de cada planta (en SAP, T001W-LAND1). Decide si un préstamo de flota
      cruza frontera y con qué flete (ADR-025).
    config:
      column_types:
        planta: varchar
        pais: varchar
    columns:
      - name: planta
        tests: [not_null, unique]
      - name: pais
        tests: [not_null]

  - name: escenarios_brecha
    description: >
      Escenarios de sensibilidad de la brecha (ADR-026). Un valor vacío toma el
      de parametros_flota; base deja todo vacío y es el escenario que publican
      mart_necesidad_flota y mart_brecha_flota. tipo_material limita el
      escenario a un tipo de empaque; vacío aplica a los dos. z_fija ignora la z
      económica. ajuste_ciclo_dias suma días naturales al ciclo del plan: así
      entran el lavado del KLT y la reparación del Rack, que viven en el
      generador y no en la política.
    config:
      column_types:
        escenario: varchar
        tipo_material: varchar
        factor_costo_quiebre: double
        costo_capital_anual_pct: double
        z_fija: double
        ajuste_ciclo_dias: double
    columns:
      - name: escenario
        tests: [not_null, unique]
      - name: tipo_material
        tests:
          - accepted_values:
              arguments:
                values: ['KLT', 'RACK']

  - name: reglas_calidad
    description: >
      Una fila por regla de calidad (ADR-028, ADR-030, ADR-031): el defecto del
      catálogo que la prueba, el objeto, la unidad que cuenta, la severidad y
      las cifras que afecta. Bloquea si rompe una identidad o si mueve una cifra
      publicada más que la materialidad; alerta en lo demás.
    config:
      column_types:
        regla: varchar
        defecto: varchar
        objeto: varchar
        unidad: varchar
        severidad: varchar
        cifra_afectada: varchar
        descripcion: varchar
    columns:
      - name: regla
        tests: [not_null, unique]
      - name: defecto
        tests: [unique]
      - name: unidad
        description: Lo que cuenta una violación; da el universo de la tasa por planta.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['linea', 'material', 'parte', 'fila']
      - name: cifra_afectada
        description: >
          Claves del seed cifras separadas por espacio; todas vale por las
          nueve y vacío por ninguna. assert_cifras_conocidas revisa las claves.
      - name: severidad
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['bloquea', 'alerta']

  - name: prefijos_material
    description: >
      Prefijo del código de material → tipo de empaque, si la empresa codifica
      la familia en el Matnr. Lo usa solo la regla grupo_contradice_codigo; sin
      convención el seed va vacío y la regla no corre (ADR-028).
    config:
      column_types:
        prefijo: varchar
        tipo_material: varchar
    columns:
      - name: prefijo
        tests: [not_null, unique]
      - name: tipo_material
        tests:
          - accepted_values:
              arguments:
                values: ['KLT', 'RACK', 'CARTON']

  - name: cifras
    description: >
      Cifras publicadas que una regla puede afectar (ADR-031). Las que mide el
      arnés de impacto deciden la materialidad; saldo_cliente y serie_mensual
      solo se declaran.
    config:
      column_types:
        cifra: varchar
        descripcion: varchar
        medida_en_arnes: boolean
    columns:
      - name: cifra
        tests: [not_null, unique]
