version: 2

models:
  - name: mart_tco_comparativo
    description: >
      Costo por ciclo del retornable contra el desechable equivalente, por
      planta y tipo. La merma entra por vida esperada; perdida_reconocida_usd
      es contexto y no se resta del ahorro.
    columns:
      - name: planta
        tests: [not_null]
      - name: tipo_material
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['KLT', 'RACK']
      - name: salidas_conciliadas
        description: >
          Salidas 621 con 120 días antes de la última conciliación. Con
          faltantes permite sumar la tasa por tipo o flota sin promediar tasas.
      - name: faltantes
        tests: [not_null]
      - name: costo_retornable_por_ciclo_usd
        tests: [not_null]
      - name: ahorro_neto_usd
        description: >
          Viajes × (desechable equivalente − costo retornable por ciclo).
          Positivo = el retornable conviene.
        tests: [not_null]
      - name: recupera_inversion
        description: El payback cae dentro de la vida esperada.
        tests: [not_null]
