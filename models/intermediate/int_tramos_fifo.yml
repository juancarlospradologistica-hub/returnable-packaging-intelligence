version: 2

models:
  - name: int_mov_cuenta
    description: >
      Movimientos 621/622/702 de la cuenta de stock especial V
      (planta × cliente × material), con delta sobre el saldo en cliente.
    columns:
      - name: cliente
        tests: [not_null]
      - name: delta_saldo
        tests: [not_null]

  - name: int_tramos_fifo
    description: >
      Intersección FIFO entre salidas 621 y cierres 622/702 por cuenta.
      Un tramo sin cierre es saldo abierto al corte. Base del ciclo de retorno;
      la merma se mide por ventana conciliada (ADR-012), no por tramos.
    columns:
      - name: planta
        tests: [not_null]
      - name: cliente
        tests: [not_null]
      - name: material
        tests: [not_null]
      - name: fecha_salida
        tests: [not_null]
      - name: cantidad
        tests: [not_null]
      - name: tipo_cierre
        description: 622 recogida, 702 faltante, null si el tramo sigue abierto.
        tests:
          - accepted_values:
              arguments:
                values: ['622', '702']
      - name: dias
        description: Días entre salida y cierre. Null en tramos abiertos.
