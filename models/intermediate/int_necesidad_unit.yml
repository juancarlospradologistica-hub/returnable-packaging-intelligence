version: 2

# Fórmula de ADR-021 con resultado calculado a mano. El backtest cuida que los
# parámetros alcancen sobre el dataset; esto, que la fórmula sea la del ADR.
unit_tests:
  - name: demanda_desde_el_plan
    description: >
      M1 con dos partes: 280 piezas a 40 por contenedor y 70 a 10 son 14
      contenedores a la semana, d_plan 2. M2 no tiene historia propia: toma el
      ciclo de su planta y tipo (el de M3, 32) y queda sin historia. La fila de
      backtest de M1 no entra.
    model: int_demanda_plan
    given:
      - input: ref('stg_plan_produccion')
        rows:
          - {planta: P1, parte: A, semana: 2026-07-06, piezas: 280}
          - {planta: P1, parte: B, semana: 2026-07-06, piezas: 70}
          - {planta: P1, parte: C, semana: 2026-07-06, piezas: 168}
      - input: ref('stg_instruccion_empaque')
        rows:
          - {planta: P1, parte: A, material: M1, tipo_material: KLT, piezas_por_contenedor: 40}
          - {planta: P1, parte: B, material: M1, tipo_material: KLT, piezas_por_contenedor: 10}
          - {planta: P1, parte: C, material: M2, tipo_material: RACK, piezas_por_contenedor: 12}
      - input: ref('int_variabilidad_uso')
        rows:
          - {ventana: necesidad, planta: P1, material: M1, tipo_material: KLT, sigma_uso: 10, d_base: 2, ciclo_dias: 30}
          - {ventana: backtest, planta: P1, material: M1, tipo_material: KLT, sigma_uso: 99, d_base: 9, ciclo_dias: 99}
          - {ventana: necesidad, planta: P1, material: M3, tipo_material: RACK, sigma_uso: 4, d_base: 1, ciclo_dias: 32}
      - input: ref('parametros_flota')
        rows:
          - {tipo_material: KLT, dias_cobertura: 3}
          - {tipo_material: RACK, dias_cobertura: 5}
    expect:
      rows:
        - {planta: P1, material: M1, d_plan: 2.0, d_base: 2.0, ciclo_dias: 30.0, sigma_uso: 10.0, dias_cobertura: 3, con_historia: true}
        - {planta: P1, material: M2, d_plan: 2.0, d_base: null, ciclo_dias: 32.0, sigma_uso: null, dias_cobertura: 5, con_historia: false}

  - name: necesidad_por_formula
    description: >
      M1 con historia: d_plan 2, ciclo 30, σ 10, z 3. Uso 60 y stock de
      seguridad máx(3 × 2, 3 × 10 × √1) = 30: necesidad 90. Con el doble de plan:
      uso 120, seguridad máx(12, 30 × √2) = 42.43, necesidad 163. M2 sin historia
      queda con el piso de cobertura: 2 × 32 + 5 × 2 = 74. Con z 2 en otro
      escenario, M1 necesita 60 + 20 = 80 y 120 + 28.28, 149. Con 1.5 días más
      de ciclo solo cambia el uso: 63 + 30 = 93 y 126 + 42.43, 169.
    model: int_necesidad_escenario
    given:
      - input: ref('int_demanda_plan')
        rows:
          - {planta: P1, material: M1, tipo_material: KLT, semana: 2026-07-06, d_plan: 2, d_base: 2, ciclo_dias: 30, sigma_uso: 10, dias_cobertura: 3, con_historia: true}
          - {planta: P1, material: M1, tipo_material: KLT, semana: 2026-07-13, d_plan: 4, d_base: 2, ciclo_dias: 30, sigma_uso: 10, dias_cobertura: 3, con_historia: true}
          - {planta: P1, material: M2, tipo_material: RACK, semana: 2026-07-06, d_plan: 2, d_base: null, ciclo_dias: 32, sigma_uso: null, dias_cobertura: 5, con_historia: false}
      - input: ref('int_z_economico')
        rows:
          - {escenario: base, tipo_material: KLT, z_servicio: 3.0, ajuste_ciclo_dias: 0}
          - {escenario: base, tipo_material: RACK, z_servicio: 3.0, ajuste_ciclo_dias: 0}
          - {escenario: bajo, tipo_material: KLT, z_servicio: 2.0, ajuste_ciclo_dias: 0}
          - {escenario: lento, tipo_material: KLT, z_servicio: 3.0, ajuste_ciclo_dias: 1.5}
    expect:
      rows:
        - {escenario: base, material: M1, semana: 2026-07-06, necesidad: 90}
        - {escenario: base, material: M1, semana: 2026-07-13, necesidad: 163}
        - {escenario: base, material: M2, semana: 2026-07-06, necesidad: 74}
        - {escenario: bajo, material: M1, semana: 2026-07-06, necesidad: 80}
        - {escenario: bajo, material: M1, semana: 2026-07-13, necesidad: 149}
        - {escenario: lento, material: M1, semana: 2026-07-06, necesidad: 93}
        - {escenario: lento, material: M1, semana: 2026-07-13, necesidad: 169}
