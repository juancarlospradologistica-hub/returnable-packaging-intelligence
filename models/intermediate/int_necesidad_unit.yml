version: 2

# Fórmula de ADR-021 con resultado calculado a mano. El backtest cuida que los
# parámetros alcancen sobre el dataset; esto, que la fórmula sea la del ADR.
unit_tests:
  - name: necesidad_por_formula
    description: >
      M1 con historia: d_plan 2, ciclo 30, σ 10, z 3. Semana 1: uso 60 y stock
      de seguridad máx(3 × 2, 3 × 10 × √1) = 30, necesidad 90. Semana 2 con el
      doble de plan: uso 120, seguridad máx(12, 30 × √2) = 42.4, necesidad 163.
      M2 sin historia toma el ciclo de su planta y tipo (32) y solo el piso de
      cobertura: 2 × 32 + 5 × 2 = 74. La fila de backtest de M1 no entra.
    model: mart_necesidad_flota
    given:
      - input: ref('stg_plan_produccion')
        rows:
          - {planta: P1, parte: A, semana: 2026-07-06, piezas: 280}
          - {planta: P1, parte: B, semana: 2026-07-06, piezas: 70}
          - {planta: P1, parte: A, semana: 2026-07-13, piezas: 560}
          - {planta: P1, parte: B, semana: 2026-07-13, piezas: 140}
          - {planta: P1, parte: C, semana: 2026-07-06, piezas: 168}
      - input: ref('stg_instruccion_empaque')
        rows:
          - {planta: P1, parte: A, material: M1, tipo_material: KLT, piezas_por_contenedor: 40}
          - {planta: P1, parte: B, material: M1, tipo_material: KLT, piezas_por_contenedor: 10}
          - {planta: P1, parte: C, material: M2, tipo_material: RACK, piezas_por_contenedor: 12}
      - input: ref('int_variabilidad_uso')
        rows:
          - {ventana: necesidad, planta: P1, material: M1, tipo_material: KLT, sigma_uso: 10, d_base: 2, ciclo_dias: 30}
          - {ventana: backtest, planta: P1, material: M1, tipo_material: KLT, sigma_uso: 99, d_base: 9, ciclo_dias: 99}
          - {ventana: necesidad, planta: P1, material: M3, tipo_material: RACK, sigma_uso: 4, d_base: 1, ciclo_dias: 32}
      - input: ref('parametros_flota')
        rows:
          - {tipo_material: KLT, dias_cobertura: 3, z_servicio: 3.0, lead_time_semanas: 4}
          - {tipo_material: RACK, dias_cobertura: 5, z_servicio: 3.0, lead_time_semanas: 12}
    expect:
      rows:
        - {planta: P1, material: M1, semana: 2026-07-06, con_historia: true, uso_plan: 60.0, stock_seguridad: 30.0, necesidad: 90}
        - {planta: P1, material: M1, semana: 2026-07-13, con_historia: true, uso_plan: 120.0, stock_seguridad: 42.4, necesidad: 163}
        - {planta: P1, material: M2, semana: 2026-07-06, con_historia: false, uso_plan: 64.0, stock_seguridad: 10.0, necesidad: 74}
