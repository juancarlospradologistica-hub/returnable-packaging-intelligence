version: 2

models:
  - name: int_tco_por_material
    description: >
      Costo total de propiedad por ciclo para cada material con historia
      de retornos. Combina amortizacion, mantenimiento y comparativa
      contra la alternativa desechable equivalente.
    columns:
      - name: planta
        tests: [not_null]
      - name: material
        tests: [not_null]
      - name: tipo_material
        tests:
          - not_null
          - accepted_values:
              values: [KLT, RACK, CARTON]
      - name: costo_retornable_por_ciclo_usd
        tests: [not_null]