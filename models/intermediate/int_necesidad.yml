version: 2

models:
  - name: int_calendario_necesidad
    description: >
      Una fila con las ventanas de la necesidad y del backtest (ADR-023):
      apertura y corte del dataset, inicio del régimen estable, base del plan,
      ventana de la variabilidad y ventanas de estimación y prueba del backtest.
    columns:
      - name: fin_base
        description: Domingo anterior al corte. Ninguna ventana entra a la semana del corte.
        tests: [not_null]
      - name: inicio_sigma
        tests: [not_null]
      - name: inicio_estimacion
        tests: [not_null]

  - name: int_uso_diario
    description: >
      Stock en uso (todo lo que no está en vacíos) y salidas a cliente por
      planta, material y día natural, en calendario completo desde la foto
      inicial hasta el corte.
    columns:
      - name: planta
        tests: [not_null]
      - name: material
        tests: [not_null]
      - name: fecha
        tests: [not_null]
      - name: en_uso
        tests: [not_null]

  - name: int_variabilidad_uso
    description: >
      Uso promedio, desviación del stock en uso, demanda diaria y ciclo total
      por planta y material, en la ventana de la necesidad y en la del backtest
      (ADR-021, ADR-023). El ciclo es por planta y tipo de empaque.
    columns:
      - name: ventana
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['necesidad', 'backtest', 'calibracion']
      - name: sigma_uso
        tests: [not_null]
      - name: ciclo_dias
        tests: [not_null]

  - name: int_curva_z
    description: >
      Días con quiebre en el tramo de calibración para cada z de la rejilla,
      por tipo de empaque (ADR-025). Traduce un nivel de servicio en z sin
      pasar por la normal.
    columns:
      - name: z
        tests: [not_null]
      - name: quiebre
        tests: [not_null]

  - name: int_z_economico
    description: >
      z por escenario y tipo de empaque escogida por costo (ADR-025, ADR-026):
      razón crítica entre el costo de quedarse corto (desechable por factor de
      quiebre entre ciclo) y el de pasarse (capital), y la menor z de
      int_curva_z que cumple el objetivo de días con quiebre. Un escenario con
      z_fija usa ese valor.
    columns:
      - name: escenario
        tests: [not_null]
      - name: tipo_material
        tests: [not_null]
      - name: z_servicio
        tests: [not_null]
      - name: objetivo_quiebre
        tests: [not_null]

  - name: int_demanda_plan
    description: >
      d_plan, d_base, ciclo, σ y piso de cobertura por planta, material y
      semana del plan, sin redondear (ADR-021, ADR-026).
    columns:
      - name: d_plan
        tests: [not_null]
      - name: ciclo_dias
        tests: [not_null]

  - name: int_necesidad_escenario
    description: >
      Necesidad de flota por escenario, planta, material y semana. El
      escenario base es el que publica mart_necesidad_flota (ADR-026).
    columns:
      - name: escenario
        tests: [not_null]
      - name: necesidad
        tests: [not_null]
