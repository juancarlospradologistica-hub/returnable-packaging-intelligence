version: 2

models:
  - name: stg_mb51
    description: >
      Vista tipada sobre raw_mb51. Un registro = una posición de documento
      material. Cantidad conserva el signo SAP.

    columns:
      - name: doc_material
        tests:
          - not_null

      - name: posicion
        tests:
          - not_null

      - name: planta
        tests:
          - not_null

      - name: almacen
        description: >
          Lgort. Uno fuera del seed almacenes se perdería en el join de
          int_mov_stock sin aviso; el 702 V no lleva almacén (MSKU).
        tests:
          - relationships:
              arguments:
                to: ref('almacenes')
                field: lgort

      - name: tipo_material
        description: Del grupo de artículos del maestro (ADR-028).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['KLT', 'RACK', 'CARTON']

      - name: mov_type
        tests:
          - not_null

      - name: fecha_contab
        tests:
          - not_null

      - name: cantidad
        tests:
          - not_null

      - name: cliente
        description: Cuenta de stock especial V. Obligatorio en 601, 621, 622 y 702.
        tests:
          - not_null:
              config:
                where: "mov_type in ('601', '621', '622', '702')"
