version: 2

sources:
  - name: raw
    schema: main
    tables:
      - name: raw_mb51
        description: >
          Movimientos de material MB51 sintéticos (ADR-011). Un Parquet por planta
          cargado a una sola tabla. Fuente única del pipeline.
        columns:
          - name: mblnr
            description: Documento material SAP.
            tests:
              - not_null
          - name: bwart
            description: >
              Clase de movimiento. 621/622/702 con stock especial V para el ciclo
              con cliente; 601 solo para cartón desechable.
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['101','102','261','309','311','411','501','502','601','621','622','702']
          - name: budat
            description: Fecha de contabilización.
            tests:
              - not_null
          - name: werks
            description: Centro / planta.
            tests:
              - not_null
          - name: matnr
            description: Código de material.
            tests:
              - not_null
          - name: menge
            description: Cantidad con signo SAP. Salidas negativas, entradas positivas.
            tests:
              - not_null
