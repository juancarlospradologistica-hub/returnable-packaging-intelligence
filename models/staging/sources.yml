version: 2

sources:
  - name: raw
    schema: main
    tables:
      - name: raw_mb51
        description: >
          Movimientos de material MB51 sintéticos (ADR-011). Un Parquet por planta
          cargado a una sola tabla. Fuente única del pipeline.
        columns:
          - name: mblnr
            description: Documento material SAP.
            tests:
              - not_null
          - name: bwart
            description: >
              Clase de movimiento. 621/622/702 con stock especial V para el ciclo
              con cliente; 601 solo para cartón desechable; 311, 325, 343, 344 y 555
              para el ciclo dentro de la planta (ADR-017). Una clase fuera del seed
              clases_movimiento la reporta la regla bwart_fuera_de_catalogo.
            tests:
              - not_null
          - name: budat
            description: Fecha de contabilización.
            tests:
              - not_null
          - name: werks
            description: Centro / planta.
            tests:
              - not_null
          - name: matnr
            description: Código de material.
            tests:
              - not_null
          - name: menge
            description: Cantidad con signo SAP. Salidas negativas, entradas positivas.
            tests:
              - not_null

      - name: raw_stock_inicial
        description: >
          Foto de stock por planta, almacén y material al cierre del día anterior
          a la ventana, equivalente a MB5B (ADR-017, punto 7; ADR-018, punto 8).
          MB51 no trae el stock con el que abre la ventana. Una fila con Kunnr y
          sin Lgort es stock especial V en cliente, como MSKU; el sintético no
          trae, un extracto real sí (ADR-036).
        columns:
          - name: werks
            tests:
              - not_null
          - name: matnr
            tests:
              - not_null
          - name: menge
            tests:
              - not_null
          - name: fecha
            tests:
              - not_null

      - name: raw_partes
        description: >
          Partes terminadas por planta y su cliente (ADR-022). En el sintético
          salen de los 621 de la ventana base; en un extracto real, del maestro
          de materiales y del registro info cliente-material. Escenario solo
          existe en el sintético.
        columns:
          - name: werks
            tests: [not_null]
          - name: parte
            tests: [not_null]
          - name: kunnr
            tests: [not_null]
          - name: escenario
            tests:
              - accepted_values:
                  arguments:
                    values: ['estable', 'arranque', 'fin_serie']

      - name: raw_instruccion_empaque
        description: >
          Instrucción de empaque (POP1): una parte, un empaque y piezas fijas
          por contenedor (ADR-016).
        columns:
          - name: werks
            tests: [not_null]
          - name: parte
            tests: [not_null]
          - name: matnr
            tests: [not_null]
          - name: piezas
            tests: [not_null]

      - name: raw_plan_produccion
        description: >
          Plan de producción semanal en piezas (MD61/PBED), lunes a domingo,
          para las semanas posteriores al corte (ADR-017, punto 8).
        columns:
          - name: werks
            tests: [not_null]
          - name: parte
            tests: [not_null]
          - name: semana
            tests: [not_null]
          - name: piezas
            tests: [not_null]

      - name: raw_maestro_materiales
        description: >
          Maestro de materiales por planta, estilo MARA/MARC/MBEW (ADR-028): texto,
          tipo de material SAP, grupo de artículos, unidad base, precio, unidad
          de precio y moneda. Fuente única del tipo de empaque y del costo unitario.
        columns:
          - name: werks
            tests: [not_null]
          - name: matnr
            tests: [not_null]
          - name: matkl
            tests: [not_null]
          - name: verpr
            tests: [not_null]
          - name: peinh
            tests: [not_null]
          - name: waers
            tests: [not_null]

      - name: raw_errores_schema
        description: >
          Fallas de Pandera en la ingesta, una fila por falla (ADR-028, punto 9):
          tabla, columna, check, valor y fila. Vacía si todo cumple el contrato.
          La regla error_de_schema las reporta.

  # Mediciones del arnés de impacto (ADR-031). El CSV vive en el repo: CI lo lee
  # sin correr el arnés, que tarda ~90 min en el completo. Todo entra como texto
  # y stg_impacto_defectos fija los tipos: la detección automática cambiaría
  # con el contenido del archivo.
  - name: calidad
    description: Salida versionada de python -m rpi.calidad.
    config:
      external_location: "read_csv('docs/calidad/{name}.csv', header = true, all_varchar = true)"
    tables:
      - name: impacto_defectos
        description: Una fila por corrida (limpio, defecto y nivel) y medida.
      - name: ciegos_antes
        description: >
          Medición de los defectos ciegos antes de escribir sus reglas (ADR-033).
          Mismo formato que impacto_defectos; no se vuelve a generar.
