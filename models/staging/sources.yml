version: 2

sources:
  - name: raw
    schema: main
    tables:
      - name: raw_mb51
        description: >
          Movimientos de material MB51 sintéticos (ADR-011). Un Parquet por planta
          cargado a una sola tabla. Fuente única del pipeline.
        columns:
          - name: mblnr
            description: Documento material SAP.
            tests:
              - not_null
          - name: bwart
            description: >
              Clase de movimiento. 621/622/702 con stock especial V para el ciclo
              con cliente; 601 solo para cartón desechable; 311, 325, 343, 344 y 555
              para el ciclo dentro de la planta (ADR-017).
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['101','102','261','311','325','343','344','555','601','621','622','702']
          - name: budat
            description: Fecha de contabilización.
            tests:
              - not_null
          - name: werks
            description: Centro / planta.
            tests:
              - not_null
          - name: matnr
            description: Código de material.
            tests:
              - not_null
          - name: menge
            description: Cantidad con signo SAP. Salidas negativas, entradas positivas.
            tests:
              - not_null

      - name: raw_stock_inicial
        description: >
          Foto de stock por planta, almacén y material al cierre del día anterior
          a la ventana, equivalente a MB5B (ADR-017, punto 7; ADR-018, punto 8).
          MB51 no trae el stock con el que abre la ventana. Kunnr queda para el
          stock especial V de un extracto real; en el sintético va vacío.
        columns:
          - name: werks
            tests:
              - not_null
          - name: lgort
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: ref('almacenes')
                    field: lgort
          - name: matnr
            tests:
              - not_null
          - name: menge
            tests:
              - not_null
          - name: fecha
            tests:
              - not_null

      - name: raw_partes
        description: >
          Partes terminadas por planta y su cliente (ADR-022). En el sintético
          salen de los 621 de la ventana base; en un extracto real, del maestro
          de materiales y del registro info cliente-material. Escenario solo
          existe en el sintético.
        columns:
          - name: werks
            tests: [not_null]
          - name: parte
            tests: [not_null]
          - name: kunnr
            tests: [not_null]
          - name: escenario
            tests:
              - accepted_values:
                  arguments:
                    values: ['estable', 'arranque', 'fin_serie']

      - name: raw_instruccion_empaque
        description: >
          Instrucción de empaque (POP1): una parte, un empaque y piezas fijas
          por contenedor (ADR-016).
        columns:
          - name: werks
            tests: [not_null]
          - name: parte
            tests: [not_null]
          - name: matnr
            tests: [not_null]
          - name: piezas
            tests: [not_null]

      - name: raw_plan_produccion
        description: >
          Plan de producción semanal en piezas (MD61/PBED), lunes a domingo,
          para las semanas posteriores al corte (ADR-017, punto 8).
        columns:
          - name: werks
            tests: [not_null]
          - name: parte
            tests: [not_null]
          - name: semana
            tests: [not_null]
          - name: piezas
            tests: [not_null]
