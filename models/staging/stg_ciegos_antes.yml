version: 2

models:
  - name: stg_ciegos_antes
    description: >
      Medición de los defectos ciegos antes de sus reglas
      (docs/calidad/ciegos_antes.csv) con sus tipos. Una fila por corrida
      (limpio, ciego y nivel) y medida.
    columns:
      - name: nivel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['limpio', 'tasa', 'techo']
      - name: medida
        tests: [not_null]
